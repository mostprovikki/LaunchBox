<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaunchBox</title>
<script src="/v2/assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/v2/assets/system.css">
<link rel="stylesheet" href="/v2/assets/launchbox.css">
</head>
<body>

<header class="appbar">
  <h1 class="appbar__brand">LaunchBox</h1>
  <!-- btv.4 (A2): fill with mainnav links (Overview/Jobs/Runs/Projects/Sessions/Settings) -->
  <nav class="mainnav" id="v2-nav"></nav>
  <div class="appbar__spacer"></div>
  <!-- btv.4 (A2): fill with usage chips, running chip, pause segs -->
  <div id="v2-chips"></div>
  <button class="iconbtn themebtn" onclick="lbToggleTheme()" aria-label="Switch between dark and light" data-tip="Switch between dark and light">
    <svg class="ic ic--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ic ic--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</header>
<!-- btv.4 (A2): daemon-down / token-invalid banner (REVIEW #2); starts hidden, filled + unhidden by the API client -->
<div id="v2-banner" class="appbanner" hidden></div>

<main class="shell">
  <!-- btv.4 (A2) mounts the hash router here; wave-2 page tasks (B1/B2/B3/C1/C2/C3) render into it -->
  <div id="v2-page">
    <p class="t-meta">mounting…</p>
  </div>
</main>

<!-- btv.4 (A2): entry point — registers routes, mounts the appbar, starts the router. -->
<script type="module" src="/v2/main.js"></script>

</body>
</html>
