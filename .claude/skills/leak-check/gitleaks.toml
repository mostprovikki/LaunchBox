# leak-check: the shared gitleaks config for side-project repos (gitleaks 8.30).
# The default rules find secrets; the rules below add Indian ID numbers.
# Employer words are NOT here: that list stays outside every repo (employer-scan.sh).
title = "leak-check"

[extend]
useDefault = true

[[rules]]
id = "in-pan"
description = "Indian PAN (permanent account number)"
regex = '''\b[A-Z]{5}[0-9]{4}[A-Z]\b'''

[[rules]]
id = "in-aadhaar"
description = "Aadhaar number, only where the text names it (no checksum test in gitleaks)"
regex = '''\b[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}\b'''
keywords = ["aadhaar", "aadhar", "uidai"]

[[rules]]
id = "in-ifsc"
description = "Indian bank branch code (IFSC)"
regex = '''\b[A-Z]{4}0[A-Z0-9]{6}\b'''

# Data files are checked in leak-check.sh, not here: the default config's global allowlist
# skips .pdf, .xlsx and .xls (measured on 8.30.1), so a path rule here never sees them.
